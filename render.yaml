# Render Blueprint: one free web service (web app + API in one container) and one free Postgres.
# Free-tier terms change; check https://render.com/docs/free before relying on them.
databases:
  - name: handover-db
    plan: free
    databaseName: handover
    user: handover

services:
  - type: web
    name: handover
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: handover-db
          property: connectionString
      # Generated once by Render and kept across deploys. Base64, 256 bits = what ENCRYPTION_KEY needs.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # You choose these in the Render dashboard (never put them in this file).
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      # Public demo settings (these are also the defaults in the start script).
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DATASET
        value: showcase
      - key: DEMO_READONLY
        value: "true"
      - key: DEMO_SEED
        value: "true"
      - key: CHAT_DAILY_LIMIT
        value: "50"
